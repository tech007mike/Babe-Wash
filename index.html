<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Babe Wash</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --pink:#ff9fc4;
    --pink2:#ff6e9f;
    --bg1:#060204;
    --bg2:#15070d;
    --glass:rgba(20,8,12,.78);
    --border:rgba(255,185,220,.22);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:'Montserrat',sans-serif;
    color:white;
}

body{
    background:
        radial-gradient(circle at top,
            rgba(255,110,170,.16),
            transparent 30%),
        linear-gradient(to bottom,
            var(--bg2),
            var(--bg1));
}

/* APP */
.app{
    position:relative;
    width:100vw;
    height:100dvh;
    overflow:hidden;
}

/* BACKGROUND */
.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.12;
    filter:blur(2px);
    transform:scale(1.05);
}

/* OVERLAY */
.overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(to bottom,
            rgba(0,0,0,.2),
            rgba(0,0,0,.55));
}

/* MAIN */
.main{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    padding:
        max(12px, env(safe-area-inset-top))
        14px
        max(12px, env(safe-area-inset-bottom))
        14px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* HEADER */
.header{
    text-align:center;
    flex-shrink:0;
}

.logo{
    font-family:'Great Vibes',cursive;
    font-size:clamp(3rem,9vw,5.5rem);
    line-height:.82;
    color:var(--pink);
    text-shadow:0 0 25px rgba(255,120,180,.3);
}

.sub{
    margin-top:6px;
    letter-spacing:3px;
    color:#ffdbe8;
    font-size:clamp(.65rem,1.8vw,.95rem);
}

/* FLOW CARD */
.flow-card{
    flex:1;
    min-height:0;

    background:var(--glass);
    border:1px solid var(--border);
    border-radius:28px;
    backdrop-filter:blur(14px);

    padding:16px;

    display:flex;
    flex-direction:column;
    overflow:hidden;

    box-shadow:
        0 0 35px rgba(255,110,170,.08),
        inset 0 0 30px rgba(255,255,255,.02);
}

/* STEP */
.step{
    display:none;
    flex-direction:column;
    height:100%;
    animation:fade .35s ease;
}

.step.active{
    display:flex;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* TITLES */
.step-title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(2rem,5vw,3rem);
    color:#fff0f6;
    text-align:center;
    margin-bottom:6px;
}

.step-sub{
    text-align:center;
    color:#f5dce7;
    font-size:clamp(.72rem,1.4vw,.95rem);
    line-height:1.5;
    margin-bottom:16px;
}

/* OPTIONS */
.options{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:12px;
}

/* OPTION CARD */
.option{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,185,220,.14);
    border-radius:22px;
    padding:16px;
    transition:.25s;
}

.option.selected{
    border-color:var(--pink);
    background:rgba(255,110,170,.10);
    box-shadow:0 0 20px rgba(255,110,170,.14);
}

.option:active{
    transform:scale(.985);
}

.option label{
    display:flex;
    align-items:flex-start;
    gap:14px;
    cursor:pointer;
}

.option input{
    width:20px;
    height:20px;
    accent-color:var(--pink2);
    margin-top:3px;
    flex-shrink:0;
}

.option-title{
    font-size:clamp(.95rem,1.8vw,1.15rem);
    color:#ffb8d2;
    font-weight:600;
}

.option-text{
    margin-top:4px;
    font-size:clamp(.72rem,1.2vw,.92rem);
    line-height:1.45;
    color:#f7dce7;
}

/* BUTTONS */
.buttons{
    display:flex;
    gap:10px;
    margin-top:16px;
}

button{
    flex:1;
    border:none;
    border-radius:18px;
    padding:15px;
    font-weight:700;
    letter-spacing:2px;
    color:white;
    font-size:clamp(.8rem,1.3vw,1rem);
}

.primary{
    background:
        linear-gradient(135deg,
            #ff92bc,
            #ff5d93);
    box-shadow:0 0 20px rgba(255,90,150,.25);
}

.secondary{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
}

/* RESULT */
.result{
    position:absolute;
    inset:0;
    z-index:100;
    display:none;

    padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom))
        14px;

    background:
        radial-gradient(circle at top,
            rgba(255,120,180,.18),
            transparent 30%),
        linear-gradient(to bottom,
            #14070d,
            #050203);
}

/* POSTER */
.poster{
    width:100%;
    height:100%;
    border-radius:30px;
    border:1px solid rgba(255,185,220,.2);

    background:
        linear-gradient(to bottom right,
            rgba(25,8,12,.96),
            rgba(8,3,5,.98));

    overflow:hidden;

    display:flex;
    flex-direction:column;

    padding:18px;

    position:relative;

    box-shadow:
        0 0 50px rgba(255,90,160,.18),
        inset 0 0 35px rgba(255,255,255,.02);
}

/* GLOW */
.poster::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at top right,
            rgba(255,110,170,.15),
            transparent 25%),
        radial-gradient(circle at bottom left,
            rgba(255,110,170,.1),
            transparent 30%);
    pointer-events:none;
}

/* POSTER HEADER */
.poster-header{
    text-align:center;
    flex-shrink:0;
}

.poster-logo{
    font-family:'Great Vibes',cursive;
    font-size:clamp(3.5rem,10vw,6rem);
    color:var(--pink);
    line-height:.8;
}

.poster-sub{
    margin-top:8px;
    letter-spacing:4px;
    color:#ffdce9;
    font-size:clamp(.65rem,1.2vw,.95rem);
}

/* POSTER CONTENT */
.poster-content{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:14px;
}

/* BOX */
.poster-box{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,185,220,.12);
    border-radius:20px;
    padding:14px;
}

.poster-box h3{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(1.4rem,3vw,2.2rem);
    color:#fff1f7;
    margin-bottom:8px;
}

.poster-item{
    font-size:clamp(.78rem,1.4vw,1rem);
    line-height:1.5;
    color:#ffe0eb;
    margin:5px 0;
}

/* FOOTER */
.poster-footer{
    text-align:center;
    margin-top:auto;
    padding-top:10px;
    letter-spacing:5px;
    color:#ffb9d1;
    font-size:clamp(.6rem,1vw,.85rem);
}

/* CLOSE */
.close{
    position:absolute;
    top:14px;
    right:14px;

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);

    color:white;
    font-size:1.1rem;
}

</style>
</head>

<body>

<div class="app">

    <img
        class="bg"
        src="0B8688F7-EBA0-46B7-A9FB-A70D23430615.png"
    >

    <div class="overlay"></div>

    <!-- MAIN -->
    <div class="main">

        <!-- HEADER -->
        <div class="header">

            <div class="logo">
                Babe Wash
            </div>

            <div class="sub">
                MORE THAN A SHOWER • IT'S CONNECTION
            </div>

        </div>

        <!-- FLOW -->
        <div class="flow-card">

            <!-- STEP 1 -->
            <div
                class="step active"
                id="step1"
            >

                <div class="step-title">
                    Choose Your Tier
                </div>

                <div class="step-sub">
                    Select the experience level.
                </div>

                <div class="options">

                    <div class="option tier-option">

                        <label>

                            <input
                                type="radio"
                                name="tier"
                                value="Tier 1 — Shower For Two"
                            >

                            <div>

                                <div class="option-title">
                                    Tier 1 — Shower For Two
                                </div>

                                <div class="option-text">
                                    Warm calming reset experience
                                    focused on comfort closeness
                                    and connection.
                                </div>

                            </div>

                        </label>

                    </div>

                    <div class="option tier-option">

                        <label>

                            <input
                                type="radio"
                                name="tier"
                                value="Tier 2 — Loving Lather"
                            >

                            <div>

                                <div class="option-title">
                                    Tier 2 — Loving Lather
                                </div>

                                <div class="option-text">
                                    Intimate sensory experience
                                    focused on softness affection
                                    and attentive tender touch.
                                </div>

                            </div>

                        </label>

                    </div>

                </div>

                <div class="buttons">

                    <button
                        class="primary"
                        onclick="goToAddons()"
                    >
                        CONTINUE
                    </button>

                </div>

            </div>

            <!-- STEP 2 -->
            <div
                class="step"
                id="step2"
            >

                <div class="step-title">
                    Select Add-On
                </div>

                <div
                    class="step-sub"
                    id="addonsSub"
                ></div>

                <div
                    class="options"
                    id="addonsContainer"
                ></div>

                <div class="buttons">

                    <button
                        class="secondary"
                        onclick="showStep(1)"
                    >
                        BACK
                    </button>

                    <button
                        class="primary"
                        onclick="showStep(3)"
                    >
                        CONTINUE
                    </button>

                </div>

            </div>

            <!-- STEP 3 -->
            <div
                class="step"
                id="step3"
            >

                <div class="step-title">
                    Premium Master Upgrade
                </div>

                <div class="step-sub">
                    Add The Liquid Embrace upgrade.
                </div>

                <div class="options">

                    <div class="option">

                        <label>

                            <input
                                type="checkbox"
                                id="masterUpgrade"
                            >

                            <div>

                                <div class="option-title">
                                    The Liquid Embrace
                                </div>

                                <div class="option-text">
                                    Extended lingering warmth touch
                                    and uninterrupted connection.
                                </div>

                            </div>

                        </label>

                    </div>

                </div>

                <div class="buttons">

                    <button
                        class="secondary"
                        onclick="showStep(2)"
                    >
                        BACK
                    </button>

                    <button
                        class="primary"
                        onclick="generatePoster()"
                    >
                        CREATE POSTER
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- RESULT -->
    <div
        class="result"
        id="result"
    >

        <div class="poster">

            <button
                class="close"
                onclick="closePoster()"
            >
                ✕
            </button>

            <div class="poster-header">

                <div class="poster-logo">
                    Babe Wash
                </div>

                <div class="poster-sub">
                    YOUR SELECTED EXPERIENCE
                </div>

            </div>

            <div class="poster-content">

                <div class="poster-box">

                    <h3>Chosen Tier</h3>

                    <div
                        class="poster-item"
                        id="posterTier"
                    ></div>

                </div>

                <div class="poster-box">

                    <h3>Selected Add-On</h3>

                    <div
                        class="poster-item"
                        id="posterAddon"
                    ></div>

                </div>

                <div class="poster-box">

                    <h3>Premium Upgrade</h3>

                    <div
                        class="poster-item"
                        id="posterUpgrade"
                    ></div>

                </div>

            </div>

            <div class="poster-footer">
                CLEANSE • CONNECT • CHERISH
            </div>

        </div>

    </div>

</div>

<script>

let selectedTier = "";

const tier1Addons = [

    {
        title:"PLUS",
        text:"Includes a soothing back wash.",
        value:"PLUS — Soothing Back Wash"
    },

    {
        title:"SUPREME",
        text:"Includes a relaxing hair wash.",
        value:"SUPREME — Relaxing Hair Wash"
    },

    {
        title:"ULTIMATE",
        text:"Includes both back wash and hair wash.",
        value:"ULTIMATE — Back Wash + Hair Wash"
    }

];

const tier2Addons = [

    {
        title:"PLUS",
        text:"Gentle washing of sensitive areas.",
        value:"PLUS — Gentle Sensitive Area Wash"
    },

    {
        title:"SUPREME",
        text:"Hair wash with scalp massage.",
        value:"SUPREME — Hair Wash + Scalp Massage"
    },

    {
        title:"ULTIMATE",
        text:"Slow silky intimate cleansing Nowhere left Untouched.",
        value:"ULTIMATE — Silky Intimate Cleansing of Anything and Everything"
    }

];

/* STEP SWITCH */
function showStep(step){

    document
        .querySelectorAll('.step')
        .forEach(el=>el.classList.remove('active'));

    document
        .getElementById(`step${step}`)
        .classList.add('active');

}

/* TIER VISUALS */
document
.querySelectorAll('.tier-option')
.forEach(option=>{

    option.addEventListener('click', ()=>{

        document
        .querySelectorAll('.tier-option')
        .forEach(el=>el.classList.remove('selected'));

        option.classList.add('selected');

        option.querySelector('input').checked = true;

    });

});

/* GO TO ADDONS */
function goToAddons(){

    const tier =
        document.querySelector(
            'input[name="tier"]:checked'
        );

    if(!tier){

        alert("Please select a tier.");
        return;

    }

    selectedTier = tier.value;

    document.getElementById("addonsSub").innerHTML =
        selectedTier;

    const container =
        document.getElementById("addonsContainer");

    container.innerHTML = "";

    const addonList =
        selectedTier.includes("Tier 1")
        ? tier1Addons
        : tier2Addons;

    addonList.forEach((addon,index)=>{

        container.innerHTML += `

            <div class="option addon-option">

                <label>

                    <input
                        type="radio"
                        name="addon"
                        value="${addon.value}"
                    >

                    <div>

                        <div class="option-title">
                            ${addon.title}
                        </div>

                        <div class="option-text">
                            ${addon.text}
                        </div>

                    </div>

                </label>

            </div>

        `;

    });

    /* SINGLE SELECT VISUAL */
    setTimeout(()=>{

        document
        .querySelectorAll('.addon-option')
        .forEach(option=>{

            option.addEventListener('click', ()=>{

                document
                .querySelectorAll('.addon-option')
                .forEach(el=>el.classList.remove('selected'));

                option.classList.add('selected');

                option.querySelector('input').checked = true;

            });

        });

    },10);

    showStep(2);

}

/* CREATE POSTER */
function generatePoster(){

    document.getElementById("posterTier").innerHTML =
        "✦ " + selectedTier;

    const addon =
        document.querySelector(
            'input[name="addon"]:checked'
        );

    document.getElementById("posterAddon").innerHTML =

        addon

        ? "✦ " + addon.value

        : "No add-on selected.";

    document.getElementById("posterUpgrade").innerHTML =

        document.getElementById("masterUpgrade").checked

        ? "✦ The Liquid Embrace Premium Upgrade Added"

        : "No premium upgrade selected.";

    document.getElementById("result").style.display =
        "block";

}

/* CLOSE */
function closePoster(){

    document.getElementById("result").style.display =
        "none";

}

</script>

</body>
</html>
